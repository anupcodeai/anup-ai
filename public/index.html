<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anup AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<style>  
body{
margin:0;
font-family:Arial,sans-serif;
background: linear-gradient(180deg, #dbeafe 0%, #f8fbff 50%, #eef5ff 100%);
}
.ai-header {
    text-align: center;
    margin: 20px auto;
    padding: 15px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    max-width: 500px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.ai-header h1 {
    margin: 0;
    font-size: 32px;
}

.ai-header p {
    margin: 8px 0 0;
    font-size: 16px;
}
background:#f5f5f5;
}

.header{
background:#FF6F00;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.chat-box{
width:90%;
max-width:700px;
margin:30px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
min-height:450px;
}

.modes{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}
.modes button:nth-child(1){
    background:#0078ff;
}

.modes button:nth-child(2){
    background:#28a745;
}

.modes button:nth-child(3){
    background:#9c27b0;
}

.modes button:nth-child(4){
    background:#ff9800;
}
.input-row{
display:flex;
gap:10px;
}

#question{
flex:1;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px 20px;
background:#FF6F00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#chat{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.user-message{
background:#0078ff;
color:white;
padding:12px;
border-radius:10px;
align-self:flex-end;
max-width:80%;
}

.ai-message{
background:#eeeeee;
padding:12px;
border-radius:10px;
align-self:flex-start;
max-width:80%;
}
#micBtn.listening {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.35);
    opacity: 0.5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
<script>
window.addEventListener("load", () => {  
let deferredPrompt;

const installBtn = document.getElementById("installBtn");

if (!installBtn) {
  console.log("Install button not found");
} else {
  installBtn.style.display = "none";
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});


});
</script>
<body>

<div class="header">
🤖 Anup AI
</div>

<div class="chat-box">

<div class="modes">
<div class="ai-header">
  <div style="display:flex;justify-content:space-between;align-items:center;">
  <h1>🤖 Anup AI</h1>
  <span id="menuBtn" style="font-size:28px;cursor:pointer;">☰</span>
</div>
  <p>पढ़ाई • करियर • रोजगार • क्रिएटर की आपकी AI मदद</p>
</div>

<div style="display:flex;justify-content:center;margin:20px 0;">
  <button id="installBtn" style="
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  ">
    📲 Install Anup AI
  </button>
</div>
<div id="sideMenu" style="
display:none;
background:white;
border-radius:14px;
padding:12px;
margin:12px auto;
max-width:420px;
box-shadow:0 6px 20px rgba(0,0,0,.18);
">
<div onclick="setMode('news')" style="padding:12px;cursor:pointer;">
📰 Daily News & Current Affairs
</div>
<div onclick="setMode('student')" style="padding:12px;cursor:pointer;">📚 Student Mode</div>

<div onclick="setMode('career')" style="padding:12px;cursor:pointer;">💼 Career Mode</div>

<div onclick="setMode('creator')" style="padding:12px;cursor:pointer;">🎬 Creator Mode</div>

<div onclick="setMode('rozgar')" style="padding:12px;cursor:pointer;">🧑‍💼 Rozgar Mode</div>
<div onclick="showHistory()" style="padding:12px">
  💬 Chat History
</div>
</div>

<div class="input-row">
<input id="question" placeholder="अपना सवाल लिखें...">



<button id="micBtn" onclick="startVoice()">🎙️</button>
<button onclick="askAI()">Send</button>
</div>

<div id="chat"></div>

<script>
    let currentMode = "student";
let isVoiceInput = false;
function setMode(mode){

    currentMode = mode;

    const input = document.getElementById("question");
if(mode === "news"){
    input.placeholder = "📰 आज की News या Current Affairs पूछें...";
}
else
    if(mode === "student"){
        input.placeholder = "📚 पढ़ाई या Exam से जुड़ा सवाल पूछें...";
    }
    else if(mode === "career"){
        input.placeholder = "💼 नौकरी या Career से जुड़ा सवाल पूछें...";
    }
    else if(mode === "creator"){
        input.placeholder = "🎬 YouTube, Instagram या Content से जुड़ा सवाल पूछें...";
    }
    else if(mode === "rozgar"){
        input.placeholder = "🧑‍💼 रोजगार, सरकारी नौकरी, प्राइवेट नौकरी, Resume या Interview से जुड़ा सवाल पूछें...";
    }
document.getElementById("chat").innerHTML = "";
}
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");

menuBtn.addEventListener("click", () => {
  if (sideMenu.style.display === "none" || sideMenu.style.display === "") {
    sideMenu.style.display = "block";
  } else {
    sideMenu.style.display = "none";
  }
});
function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("आपके Browser में Voice Input उपलब्ध नहीं है।");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.interimResults = true;

  recognition.onresult = function(event){

    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
    }

    document.getElementById("question").value = transcript;

    if (event.results[event.results.length - 1].isFinal) {
    document.getElementById("micBtn").classList.remove("listening");
    askAI();
}
};
isVoiceInput = true;
document.getElementById("micBtn").classList.add("listening");
  recognition.start();
}
document.getElementById("scanInput").addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;
   

    Tesseract.recognize(
    file,
    "eng+hin"
).then(({ data: { text } }) => {

    document.getElementById("question").value = text;

});

});
async function askAI(){

    const question = document.getElementById("question").value;
    
let finalQuestion = question;

if (currentMode === "news") {
    finalQuestion =
    "आज की ताज़ा न्यूज़ और Current Affairs के आधार पर जवाब दो: " + question;
}
    if(question.trim()==""){
        return;
    }

    const chat = document.getElementById("chat");

    const userMsg = document.createElement("div");
    userMsg.className = "user-message";
    userMsg.innerText = question;
    chat.appendChild(userMsg);

    const response = await fetch("/ask",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            question: finalQuestion,
            mode: currentMode
        })
    });

    const data = await response.json();
let history = JSON.parse(localStorage.getItem("chatHistory")) || [];

history.push({
    question: question,
    answer: data.answer
});

localStorage.setItem("chatHistory", JSON.stringify(history));
    const aiMsg = document.createElement("div");
    aiMsg.style.whiteSpace = "pre-wrap";
    aiMsg.className = "ai-message";
    typeWriter(aiMsg, data.answer);
    chat.appendChild(aiMsg);
const speech = new SpeechSynthesisUtterance(data.answer || aiMsg.innerText);
speech.lang = "hi-IN";
speech.rate = 1;
speech.pitch = 1;
window.speechSynthesis.cancel();

if (isVoiceInput) {
    window.speechSynthesis.speak(speech);
}
    document.getElementById("question").value="";
}
document.getElementById("menuBtn").addEventListener("click", function () {
  const menu = document.getElementById("sideMenu");

  if (menu.style.display === "none" || menu.style.display === "") {
    menu.style.display = "block";
  } else {
    menu.style.display = "none";
  }
});
let deferredPrompt;

const installBtn = document.getElementById("installBtn");

if (installBtn) {
  installBtn.style.display = "none";

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) {
      alert("Install अभी उपलब्ध नहीं है। कृपया पेज को Refresh करें।");
      return;
    }

    deferredPrompt.prompt();

    const choiceResult = await deferredPrompt.userChoice;

    if (choiceResult.outcome === "accepted") {
      console.log("User accepted the install prompt");
    }

    deferredPrompt = null;
    installBtn.style.display = "none";
  });
}
function typeWriter(element, text) {
  let i = 0;
  element.innerText = "";

  const speed = 18; // जितना कम, उतनी तेज़ टाइपिंग

  function typing() {
    if (i < text.length) {
      element.innerText += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    }
  }

  typing();
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log(err));
  });
}
</script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker Registered"))
    .catch((error) => console.log("Service Worker Error", error));
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
<script>
function showHistory() {

    const oldChats = JSON.parse(localStorage.getItem("chatHistory")) || [];

    let historyText = "";

    if (oldChats.length === 0) {
        historyText = "अभी कोई Chat History नहीं है";
    } else {
        oldChats.forEach(chat => {
            historyText +=
            "👤 आप: " + chat.question + "\n" +
            "🤖 Anup AI: " + chat.answer + "\n\n";
        });
    }

    alert(historyText);
}
</script>
</body>
</html>
