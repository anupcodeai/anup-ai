<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anup AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#FF6F00;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.chat-box{
width:90%;
max-width:700px;
margin:30px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
min-height:450px;
}

.modes{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}
.modes button:nth-child(1){
    background:#0078ff;
}

.modes button:nth-child(2){
    background:#28a745;
}

.modes button:nth-child(3){
    background:#9c27b0;
}

.modes button:nth-child(4){
    background:#ff9800;
}
.input-row{
display:flex;
gap:10px;
}

#question{
flex:1;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px 20px;
background:#FF6F00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#chat{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.user-message{
background:#0078ff;
color:white;
padding:12px;
border-radius:10px;
align-self:flex-end;
max-width:80%;
}

.ai-message{
background:#eeeeee;
padding:12px;
border-radius:10px;
align-self:flex-start;
max-width:80%;
}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
<script>
window.addEventListener("load", () => {  
let deferredPrompt;

const installBtn = document.getElementById("installBtn");

if (!installBtn) {
  console.log("Install button not found");
} else {
  installBtn.style.display = "none";
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});
}

});
</script>
<body>

<div class="header">
🤖 Anup AI
</div>

<div class="chat-box">

<div class="modes">

<button onclick="setMode('student')">
🧑‍🎓 Student Mode
</button>

<button onclick="setMode('career')">
💼 Career Mode
</button>

<button onclick="setMode('creator')">
🎬 Creator Mode
</button>

<button onclick="setMode('rozgar')">
🧑‍💼 Rozgar Mode
</button>
<div style="display:flex;justify-content:center;margin:20px 0;">
  <button id="installBtn" style="
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  ">
    📲 Install Anupi AI
  </button>
</div>


<div class="input-row">
<input id="question" placeholder="अपना सवाल लिखें...">
<button onclick="askAI()">Send</button>
</div>

<div id="chat"></div>

<script>
    let currentMode = "student";

function setMode(mode){

    currentMode = mode;

    const input = document.getElementById("question");

    if(mode === "student"){
        input.placeholder = "📚 पढ़ाई या Exam से जुड़ा सवाल पूछें...";
    }
    else if(mode === "career"){
        input.placeholder = "💼 नौकरी या Career से जुड़ा सवाल पूछें...";
    }
    else if(mode === "creator"){
        input.placeholder = "🎬 YouTube, Instagram या Content से जुड़ा सवाल पूछें...";
    }
    else if(mode === "rozgar"){
        input.placeholder = "🧑‍💼 रोजगार, सरकारी नौकरी, प्राइवेट नौकरी, Resume या Interview से जुड़ा सवाल पूछें...";
    }

}

async function askAI(){

    const question = document.getElementById("question").value;

    if(question.trim()==""){
        return;
    }

    const chat = document.getElementById("chat");

    const userMsg = document.createElement("div");
    userMsg.className = "user-message";
    userMsg.innerText = question;
    chat.appendChild(userMsg);

    const response = await fetch("/ask",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            question:question,
            mode:currentMode
        })
    });

    const data = await response.json();

    const aiMsg = document.createElement("div");
    aiMsg.className = "ai-message";
    aiMsg.innerText = data.answer;
    chat.appendChild(aiMsg);

    document.getElementById("question").value="";
}
let deferredPrompt;

const installBtn = document.getElementById("installBtn");

if (installBtn) {
  installBtn.style.display = "none";

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) {
      alert("Install अभी उपलब्ध नहीं है। कृपया पेज को Refresh करें।");
      return;
    }

    deferredPrompt.prompt();

    const choiceResult = await deferredPrompt.userChoice;

    if (choiceResult.outcome === "accepted") {
      console.log("User accepted the install prompt");
    }

    deferredPrompt = null;
    installBtn.style.display = "none";
  });
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log(err));
  });
}
</script>
</body>
</html>
