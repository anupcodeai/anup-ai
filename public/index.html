<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anup AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#FF6F00;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.chat-box{
width:90%;
max-width:700px;
margin:30px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
min-height:450px;
}

.input-row{
display:flex;
align-items:center;
gap:8px;
width:100%;
}

#question{
flex:1;
width:auto;
}

.input-row button{
width:90px;
flex-shrink:0;
}

@media (max-width:600px){
.input-row{
flex-direction:row;
}

#question{
flex:1;
}

button{
width:90px;
background:#0078ff;
color:white;
border-radius:12px;
padding:10px;
}
}

#question{
flex:1;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

button{
padding:12px 20px;
background:#FF6F00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#e65c00;
}

#answer{
margin-top:20px;
padding:15px;
background:#eeeeee;
border-radius:10px;
min-height:80px;
font-size:16px;
}
#chat{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.ai-message{
background:#eeeeee;
padding:12px;
border-radius:10px;
max-width:80%;
align-self:flex-start;
}

.user-message{
background:#eeeeee;
color:#000;
padding:12px;
border-radius:10px;
max-width:80%;
align-self:flex-end;
}
.modes{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.modes button:nth-child(1){
background:#0078ff;
}

.modes button:nth-child(2){
background:#28a745;
}

.modes button:nth-child(3){
background:#9c27b0;
}
</style>

</head>

<body>

<div class="header">
🤖 Anup AI
</div>

<div class="chat-box">
<div class="modes">

<button>
🧑‍🎓 Student Mode
</button>

<button>
💼 Career Mode
</button>

<button>
🎬 Creator Mode
</button>

</div>
<div class="input-row">
<input id="question" placeholder="अपना सवाल लिखें...">
<button onclick="askAI()">Send</button>
</div>

<div id="chat">

</div>

</div>

<script>

async function askAI(){

const question = document.getElementById("question").value;

if(question.trim()==""){
return;
}

// user message show
const chat = document.getElementById("chat");

const userMsg = document.createElement("div");
userMsg.className = "user-message";
userMsg.innerText = question;

chat.appendChild(userMsg);


// AI request
const response = await fetch("/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

});


const data = await response.json();


// AI message show
const aiMsg = document.createElement("div");

aiMsg.className = "ai-message";

aiMsg.innerText = data.answer;

chat.appendChild(aiMsg);


// input clear
document.getElementById("question").value="";

}

</script>

</body>
</html>
