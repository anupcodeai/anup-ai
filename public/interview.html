<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Practice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#7c3aed);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:700px;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h2{
text-align:center;
color:#2563eb;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
margin-bottom:6px;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
outline:none;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:15px;
margin-top:18px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#chatBox{
display:none;
margin-top:25px;
border:1px solid #ddd;
border-radius:12px;
padding:15px;
background:#f8f8f8;
}

.aiQuestion{
background:#e8f0fe;
padding:12px;
border-radius:10px;
margin-bottom:15px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>🎤 AI Interview Practice</h2>

<label>💼 Job Name</label>
<input type="text" id="job" placeholder="Example: Software Engineer">

<label>⭐ Experience Level</label>
<select id="level">
<option>Fresher</option>
<option>Experienced</option>
</select>

<label>🌐 Interview Language</label>
<select id="language">
<option>English</option>
<option>Hindi</option>
</select>

<button onclick="startInterview()">
🚀 Start AI Interview
</button>

<div id="chatBox">

<div class="aiQuestion" id="question">
AI Question will appear here...
</div>

<label>Your Answer</label>

<textarea
id="answer"
placeholder="Type your answer here...">
</textarea>

<button onclick="nextQuestion()">
➡️ Next Question
</button>

</div>

</div>
<script>

let job="";
let level="";
let language="";
let questionNo=1;

async function startInterview() {

    job = document.getElementById("job").value;
    level = document.getElementById("level").value;
    language = document.getElementById("language").value;

    if (job == "") {
        alert("Please enter Job Name");
        return;
    }

    document.getElementById("chatBox").style.display = "block";

    const res = await fetch("/api/interview", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            job: job,
            level: level,
            language: language,
            answer: ""
        })
    });

    const data = await res.json();

    questionNo = 1;

    document.getElementById("question").innerHTML =
        "<b>Question 1:</b><br>" + data.question;
}

async function nextQuestion(){

const answer = document.getElementById("answer").value;

if(answer==""){
alert("Please enter your answer.");
return;
}

document.getElementById("answer").value="";

const res = await fetch("/api/interview",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
job: job,
level: level,
language: language,
questionNo: questionNo,
answer: answer
})
});

const data = await res.json();

questionNo++;
if (questionNo > 5) {
    document.getElementById("question").innerHTML =
    "<h3>🏆 Interview Completed</h3><br>" + data.question;
    return;
}
document.getElementById("question").innerHTML =
"<b>Question "+questionNo+":</b><br>"+data.question;

}

</script>

</body>
</html>
