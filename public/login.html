<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Anup AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#2563eb;
    margin-bottom:25px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    margin-top:8px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.signup{
    text-align:center;
    margin-top:18px;
}

.signup a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>🤖 Login to Anup AI</h2>

<label>Email</label>
<input
    type="email"
    id="email"
    placeholder="Enter your email"
>

<label>Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter your password"
>

<button onclick="login()">
🔐 Login
</button>

<div id="message"></div>

<div class="signup">
Don't have an account?
<a href="/signup.html">Create Account</a>
</div>

</div>

<script>

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(!email || !password){
        message.innerText =
            "Please enter email and password.";
        return;
    }

    try{

        const res = await fetch("/api/auth/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                email:email,
                password:password
            })
        });

        const data = await res.json();

        message.innerText = data.message;

        if(res.ok){

            localStorage.setItem(
                "anupAIUser",
                JSON.stringify(data.user)
            );

            setTimeout(()=>{
                window.location.href="/";
            },1000);
        }

    }catch(error){

        console.log(error);

        message.innerText =
            "Login failed. Please try again.";
    }
}

</script>

</body>
</html>
