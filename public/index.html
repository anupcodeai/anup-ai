<style>  
body{
margin:0;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top left, rgba(37,99,235,0.35), transparent 35%),
radial-gradient(circle at bottom right, rgba(124,58,237,0.35), transparent 35%),
linear-gradient(135deg, #020617, #0f172a, #1e3a8a);
}
.ai-header {
    text-align: center;
    margin: 20px auto;
    padding: 15px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    max-width: 500px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.ai-header h1 {
    margin: 0;
    font-size: 32px;
}

.ai-header p {
    margin: 8px 0 0;
    font-size: 16px;
}


.header{
background:#FF6F00;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.chat-box{
width:90%;
max-width:700px;
margin:30px auto;
background: rgba(255,255,255,0.18);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255,255,255,0.35);
box-shadow: 0 10px 35px rgba(0,0,0,0.25);
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
min-height:450px;
}

.modes{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}
.modes button:nth-child(1){
    background:#0078ff;
}

.modes button:nth-child(2){
    background:#28a745;
}

.modes button:nth-child(3){
    background:#9c27b0;
}

.modes button:nth-child(4){
    background:#ff9800;
}
.input-row{
display:flex;
gap:10px;
}

#question{
flex:1;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px 20px;
background:#FF6F00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
#micBtn{
background:transparent !important;
border:none !important;
box-shadow:none !important;
padding:0 !important;
margin:0 8px;
color:black !important;
font-size:30px;
border-radius:0 !important;
}
#chat{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.user-message{
background:#0078ff;
color:white;
padding:12px;
border-radius:10px;
align-self:flex-end;
max-width:80%;
}

.ai-message{
background:#eeeeee;
padding:12px;
border-radius:10px;
align-self:flex-start;
max-width:80%;
}
#micBtn.listening {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.35);
    opacity: 0.5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
*{
  -webkit-tap-highlight-color: transparent;
}

button.item{
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

</style>

<meta name="theme-color" content="#2563eb">
</head>
<script>

</script>
<body>

<div class="header">
🤖 Anup AI
</div>

<div class="chat-box">

<div class="modes">
<div class="ai-header">
  <div style="display:flex;justify-content:space-between;align-items:center;">
  <h1>Smart AI</h1>
  <span id="menuBtn" style="font-size:28px;cursor:pointer;">☰</span>
</div>
  <p>हर सवाल का स्मार्ट जवाब • हर कदम पर आपका साथ</p>
</div>

<div style="display:flex;justify-content:center;margin:20px 0;">
<button id="installBtn" onclick="installApp()" style="
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
">
📲 Install Anup AI
</button>
</div>
<div id="sideMenu" style="
display:none;
background: rgba(255,255,255,0.15);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 10px 35px rgba(0,0,0,0.25);
border-radius:14px;
padding:12px;
margin:12px auto;
max-width:420px;
box-shadow:0 6px 20px rgba(0,0,0,.18);
">
<div onclick="setMode('news')" style="padding:12px;cursor:pointer;">
📰 Daily News & Current Affairs
</div>
<div onclick="farmerBuddy()" style="padding:12px;cursor:pointer;">
🌾 Farmer Buddy
</div>

<div onclick="governmentHelp()" style="padding:12px;cursor:pointer;">
🏛️ Government Help
</div>

<div onclick="studyJobs()" style="padding:12px;cursor:pointer;">
📚 Study & Jobs
</div>

<div onclick="earnMoney()" style="padding:12px;cursor:pointer;">
💰 Earn Money
</div>

<div onclick="aiTools()" style="padding:12px;cursor:pointer;">
🤖 AI Tools
</div>
<div onclick="showHistory()" style="padding:12px; cursor:pointer;">
  💬 Chat History
</div>
<div id="historyPage" style="
display:none;
background:white;
padding:20px;
margin:20px auto;
max-width:700px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
">

<h2>💬 Chat History</h2>

<div id="historyContent" style="
max-height:500px;
overflow-y:auto;
padding:10px;
">

</div>

<button onclick="closeHistory()" style="
margin-top:15px;
background:#2563eb;
color:white;
border:none;
padding:12px 20px;

">
⬅️ वापस
</button>


</div>

<div class="input-row">
<input id="question" placeholder="अपना सवाल लिखें...">



<button id="micBtn" onclick="startVoice()">🎙️</button>
<button onclick="askAI()">Send</button>
</div>

<div id="chat"></div>

<script>
    let currentMode = "student";
let isVoiceInput = false;
function setMode(mode){

    currentMode = mode;

    const input = document.getElementById("question");
if(mode === "news"){
    input.placeholder = "📰 आज की News या Current Affairs पूछें...";
}
else
    if(mode === "student"){
        input.placeholder = "📚 पढ़ाई या Exam से जुड़ा सवाल पूछें...";
    }
    else if(mode === "career"){
        input.placeholder = "💼 नौकरी या Career से जुड़ा सवाल पूछें...";
    }
    else if(mode === "creator"){
        input.placeholder = "🎬 YouTube, Instagram या Content से जुड़ा सवाल पूछें...";
    }
    else if(mode === "rozgar"){
        input.placeholder = "🧑‍💼 रोजगार, सरकारी नौकरी, प्राइवेट नौकरी, Resume या Interview से जुड़ा सवाल पूछें...";
    }
document.getElementById("chat").innerHTML = "";
}
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");

menuBtn.addEventListener("click", () => {
  if (sideMenu.style.display === "none" || sideMenu.style.display === "") {
    sideMenu.style.display = "block";
  } else {
    sideMenu.style.display = "none";
  }
});
function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("आपके Browser में Voice Input उपलब्ध नहीं है।");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.interimResults = true;

  recognition.onresult = function(event){

    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
    }

    document.getElementById("question").value = transcript;

    if (event.results[event.results.length - 1].isFinal) {
    document.getElementById("micBtn").classList.remove("listening");
    askAI();
}
};
isVoiceInput = true;
document.getElementById("micBtn").classList.add("listening");
  recognition.start();
}
const scanInput = document.getElementById("scanInput");

if (scanInput) {
document.getElementById("scanInput").addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;
   

    Tesseract.recognize(
    file,
    "eng+hin"
).then(({ data: { text } }) => {

    document.getElementById("question").value = text;

});

});
}
window.addEventListener("load", () => {
    const params = new URLSearchParams(window.location.search);

    if (
        params.get("mode") === "army" &&
        params.get("topic") === "vacancy"
    ) {
        document.getElementById("question").value =
            "Army latest vacancy, age limit, qualification, last date aur official notification batao.";

        currentMode = "career";

        askAI();

        history.replaceState({}, "", "index.html");
    }
    if (
    params.get("mode") === "army" &&
    params.get("topic") === "syllabus"
) {
    document.getElementById("question").value =
        "Army syllabus detail me batao.";

    currentMode = "career";

    askAI();

    history.replaceState({}, "", "index.html");
}

if (
    params.get("mode") === "army" &&
    params.get("topic") === "physical"
) {
    document.getElementById("question").value =
        "Army physical test, height, chest, running aur medical standards batao.";

    currentMode = "career";

    askAI();

    history.replaceState({}, "", "index.html");
}
});
window.addEventListener("load", () => {

    const autoQuestion = localStorage.getItem("autoQuestion");

    if (autoQuestion) {

        document.getElementById("question").value = autoQuestion;

        currentMode = "career";

        askAI();

        localStorage.removeItem("autoQuestion");
    }

});
async function askAI(){

    const question = document.getElementById("question").value;
    
let finalQuestion = question;

if (currentMode === "news") {
    finalQuestion =
    "आज की ताज़ा न्यूज़ और Current Affairs के आधार पर जवाब दो: " + question;
}
    if(question.trim()==""){
        return;
    }

    const chat = document.getElementById("chat");

    const userMsg = document.createElement("div");
    userMsg.className = "user-message";
    userMsg.innerText = question;
    chat.appendChild(userMsg);

    const response = await fetch("/ask",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            question: finalQuestion,
            mode: currentMode
        })
    });

    const data = await response.json();
let history = JSON.parse(localStorage.getItem("chatHistory")) || [];

history.push({
    question: question,
    answer: data.answer
});

localStorage.setItem("chatHistory", JSON.stringify(history));
    const aiMsg = document.createElement("div");
    aiMsg.style.whiteSpace = "pre-wrap";
    aiMsg.className = "ai-message";
    typeWriter(aiMsg, data.answer);
    chat.appendChild(aiMsg);
const speech = new SpeechSynthesisUtterance(data.answer);
speech.lang = "hi-IN";
speech.rate = 1;
speech.pitch = 1;

window.speechSynthesis.cancel();

if (isVoiceInput) {
    window.speechSynthesis.speak(speech);
}

isVoiceInput = false;
    document.getElementById("question").value="";
}

let deferredPrompt;

let installBtn;

window.addEventListener("DOMContentLoaded", () => {
    installBtn = document.getElementById("installBtn");
    if (window.matchMedia("(display-mode: standalone)").matches) {
    installBtn.style.display = "none";
}
});

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
    console.log("Install event received");
});

function typeWriter(element, text) {
  let i = 0;
  element.innerText = "";

  const speed = 18; // जितना कम, उतनी तेज़ टाइपिंग

  function typing() {
    if (i < text.length) {
      element.innerText += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    }
  }

  typing();
}
function installApp() {

    if (!deferredPrompt) {
        console.log(deferredPrompt);
        return;
    }

    deferredPrompt.prompt();

    deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        installBtn.style.display = "none";
    });

}
</script>

</script>
<script>
function showHistory() {

let oldChats = JSON.parse(localStorage.getItem("chatHistory")) || [];

let box = document.getElementById("historyContent");

box.innerHTML = "";

if (oldChats.length === 0) {
    box.innerHTML = "<p>कोई Chat History नहीं मिली।</p>";
} else {

oldChats.forEach(chat => {

box.innerHTML += `
<div style="
background:#f1f5f9;
padding:15px;
margin:10px 0;
border-radius:12px;
border:1px solid #ddd;
">

<b>👤 आप:</b><br>
${chat.question}

<br><br>

<b>🤖 Anup AI:</b><br>
${chat.answer}

</div>
`;

});

}

document.getElementById("historyPage").style.display = "block";

}
function closeHistory() {
    document.getElementById("historyPage").style.display = "none";
    document.getElementById("chat").style.display = "block";

    const box = document.querySelector(".chat-box");
    if (box) {
        box.style.display = "flex";
    }
}
function farmerBuddy() {
    window.location.href = "farmer.html";
}
function governmentHelp() {
    window.location.href = "government.html";
}
</script>
