<script>
function toggleArmy(){
    const old = document.getElementById("armySection");
    if(old){
        old.remove();
        return;
    }

    const box = document.createElement("div");
    box.id = "armySection";
    box.style.margin = "10px 0 20px 20px";

    box.innerHTML = `
    <div class="item" onclick="armyVacancy()">
📋 Army Vacancy
</div>
    <div class="item" onclick="armySyllabus()">
📚 Army Syllabus
</div>
        <div class="item" onclick="armyPhysical()">
🏃 Physical Test
</div>
        <div class="item" onclick="askArmyAI()">
🤖 Ask Army AI
</div>
    `;

    document.querySelector(".item").after(box);
}
</script>
