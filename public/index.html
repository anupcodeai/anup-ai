<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anup AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#FF6F00;
color:white;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.chat-box{
width:90%;
max-width:700px;
margin:30px auto;
background:white;
min-height: 450px;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

#answer{
margin-top:20px;
padding:15px;
background:#eeeeee;
border-radius:10px;
min-height:80px;
}

input{
width:75%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
font-size:16px;
background:#0078ff;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#FF6F00;
}

</style>

</head>

<body>

<div class="header">
Anup AI
</div>

<div class="chat-box">

<input
id="question"
placeholder="अपना सवाल लिखें..."
>

<button onclick="askAI()">
Send
</button>

<div id="answer">
यहाँ AI का जवाब दिखाई देगा...
</div>

</div>

<script>

async function askAI(){

const question=document.getElementById("question").value;

const response=await fetch("/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

});

const data=await response.json();

document.getElementById("answer").innerText=data.answer;

}

</script>

</body>
</html>
